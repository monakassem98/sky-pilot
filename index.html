<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyPilot: Emergency Runway</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe8ff;--ink:#23395b;--red:#ff5a5f;--sun:#ffc93c;--grn:#2fbf71;--pur:#7b5cff;--card:#fffdf7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:var(--sky);touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:.7em 1.4em;background:var(--sun);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #d9a21a;transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a21a}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
button.sec{background:#fff;box-shadow:0 4px 0 #b9c7d9}
button.grn{background:var(--grn);color:#fff;box-shadow:0 4px 0 #1e8a50}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(35,57,91,.35);z-index:10;overflow:auto}
.ov.on{display:flex}
.box{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:20px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 0 rgba(35,57,91,.25)}
.box h1{margin:0 0 4px;font-size:clamp(28px,6vw,44px);line-height:1}
.box p{margin:.4em 0}
input,textarea,select{font:inherit;width:100%;padding:.6em .9em;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:.2em .8em;border-radius:999px;color:#fff;font-weight:700;font-size:14px}
.radar{display:flex;gap:10px;align-items:center;background:#16324f;color:#9dffb8;border-radius:18px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.radar i{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid #9dffb8;background:radial-gradient(circle,#9dffb8 0 3px,transparent 4px);animation:ping 1.2s infinite}
@keyframes ping{50%{box-shadow:0 0 0 8px rgba(157,255,184,.25)}}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
mark{background:#b6f5ce;border-radius:6px;padding:0 3px;color:#0b5c32}
.fb{margin-top:10px;padding:12px;border-radius:16px;font-size:15px}
.ok{background:#e1fbe9;border:3px solid var(--grn)}.bad{background:#fff0ee;border:3px solid var(--red)}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:none;justify-content:space-between;gap:8px;pointer-events:none;z-index:5;font-weight:700;font-size:clamp(14px,3.6vw,20px)}
#hud span{background:#fffd;border:3px solid var(--ink);border-radius:999px;padding:.2em .8em}
#pad{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;display:none;grid-template:repeat(2,52px)/repeat(3,52px);gap:6px;z-index:5}
#pad button{padding:0;font-size:22px;box-shadow:0 3px 0 #d9a21a;opacity:.85}
#pad .u{grid-area:1/2}#pad .l{grid-area:2/1}#pad .d{grid-area:2/2}#pad .r{grid-area:2/3}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{padding:.4em 1em;box-shadow:none;background:#e6eef7}.tabs button.on{background:var(--pur);color:#fff}
.q{border:3px solid #cdd9e8;border-radius:18px;padding:10px;margin:8px 0;background:#fff}
.q input,.q textarea,.q select{margin:3px 0;padding:.4em .7em;border-width:2px;border-radius:12px;font-size:15px}
.q textarea{min-height:48px}
pre{background:#16324f;color:#cfe;padding:12px;border-radius:14px;overflow:auto;font-size:12px;white-space:pre-wrap}
small{opacity:.75}
.lic{border:5px double #b8860b;background:linear-gradient(#fff8dc,#ffe9a8);border-radius:14px;padding:14px;margin:10px 0;text-align:center;transform:rotate(-1.5deg)}
.lic b{font-size:clamp(22px,5vw,32px);display:block;margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #cdd9e8;padding:4px;text-align:left;vertical-align:top}
.opt{display:flex;gap:10px;align-items:center;border:3px solid #cdd9e8;border-radius:16px;padding:.5em .8em;margin:6px 0;background:#fff;cursor:pointer}
.opt input{width:auto;margin:0}.opt.good{border-color:var(--grn);background:#e1fbe9}.opt.badopt{border-color:var(--red);background:#fff0ee}
.q label{display:block;font-size:13px;font-weight:600}.q .opr{display:flex;gap:6px;align-items:center}.q .opr input[type=radio]{width:auto}
html,body,button,.box,.opt,.seg,.badge,.radar,.fb,.lic,#hud,#pad,canvas,label{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,pre,code{-webkit-user-select:text;user-select:text}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none;pointer-events:none}
.hero{line-height:1}.hero .ic{width:68px;height:68px;color:var(--red)}
.pk{margin:10px 0}.pl{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sg{padding:.45em .9em;font-size:14px;background:#fff;box-shadow:0 3px 0 #b9c7d9;display:inline-flex;gap:6px;align-items:center}
.sg.on{background:var(--pur);color:#fff;box-shadow:0 3px 0 #4a36b0}
.hp{color:#ff5a5f}.hp.lost{color:#9aa7b8}
.tm{float:right;font-weight:700;background:#16324f;color:#9dffb8;border-radius:999px;padding:.1em .8em}
.hint{font-size:14px;color:#4a5f80;margin-bottom:6px}
.fb .ic{margin-right:2px}
@media (prefers-reduced-motion:reduce){.shake,.radar i{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="hQ"></span><span id="hS"></span><span id="hH"></span></div>
<div id="pad"><button class="u" data-k="up" aria-label="Up"><i data-ic="up"></i></button><button class="l" data-k="left" aria-label="Left"><i data-ic="left"></i></button><button class="d" data-k="down" aria-label="Down"><i data-ic="down"></i></button><button class="r" data-k="right" aria-label="Right"><i data-ic="right"></i></button></div>

<!-- GATE -->
<div class="ov on" id="gate"><div class="box" style="text-align:center">
<div class="hero"><i data-ic="plane"></i></div>
<h1>SkyPilot: Emergency Runway</h1>
<p>Fly, grab stars, and answer science questions to keep your craft flying!</p>
<input id="nm" placeholder="Pilot name" maxlength="30" aria-label="Pilot name" style="text-align:center;margin:8px 0">
<small id="lockNote"></small>
<div class="pk"><span class="pl">Theme</span><div class="seg thSeg" role="radiogroup" aria-label="Theme"></div></div>
<div class="pk"><span class="pl">Level</span><div class="seg dfSeg" role="radiogroup" aria-label="Level"></div><small class="dfNote"></small></div>
<div class="row" style="justify-content:center"><button class="grn" id="go"><i data-ic="plane"></i> Take off!</button><button class="sec" id="tp"><i data-ic="gear"></i> Teacher Portal</button></div>
<p><small>Move: arrow keys / W A S D, or drag on the screen.</small></p>
</div></div>

<!-- QUESTION -->
<div class="ov" id="qov"><div class="box" id="qbox">
<div class="radar"><i></i><div>Tower calling SkyPilot! Engine overheating! Transmit scientific clearance code to stabilize!</div></div>
<div id="qtm" class="tm" hidden></div><span class="badge" id="qt"></span>
<h2 id="qp" style="margin:8px 0"></h2><div id="qh" class="hint"></div>
<div id="qopts"></div>
<textarea id="qa" placeholder="Type your full sentence explanation here…" aria-label="Your answer"></textarea>
<div class="row"><button class="grn" id="qs"><i data-ic="radar"></i> Transmit code</button><button class="sec" id="qx" style="display:none">Close preview</button></div>
<div id="qf"></div>
</div></div>

<!-- END -->
<div class="ov" id="eov"><div class="box" id="ebox" style="text-align:center"></div></div>

<!-- PORTAL -->
<div class="ov" id="por"><div class="box" style="width:min(820px,100%)">
<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:28px"><i data-ic="gear"></i> Teacher Portal</h1><button class="sec" id="pc">Close</button></div>
<div class="tabs" id="tabs"></div>
<div id="pbody"></div>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SALT='skypilot-v1',CRUISE=12;
/* ---------- inline SVG icons (no text emoji) ---------- */
const stk=p=>'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</g>',fl=d=>'<path fill="currentColor" d="'+d+'"/>';
const ICONS={
 plane:'<g transform="rotate(45 12 12)">'+fl('M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z')+'</g>',
 star:fl('M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z'),
 radar:stk('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6.5-6.5"/>'),
 lock:stk('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
 check:stk('<path d="M4.5 12.5l5 5L19.5 7"/>'),cross:stk('<path d="M6 6l12 12M18 6L6 18"/>'),
 gear:stk('<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22M5 5l2.5 2.5M16.5 16.5L19 19M5 19l2.5-2.5M16.5 7.5L19 5"/>'),
 up:fl('M12 5l8 11H4z'),left:fl('M5 12l11-8v16z'),right:fl('M19 12L8 4v16z'),down:fl('M12 19L4 8h16z'),
 heart:fl('M12 21s-8.5-5.4-8.5-11.2A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.5 2.6C20.5 15.6 12 21 12 21z'),
 flag:stk('<path d="M6 21V4"/><path d="M6 5h11l-2.5 4L17 13H6"/>'),
 warn:stk('<path d="M12 3l10 18H2z"/><path d="M12 10v4.5M12 17.5v.5"/>'),
 flame:fl('M12 22c4 0 6.5-2.6 6.5-6 0-3.2-2.2-5.2-3.2-7.5-1 2.2-2.3 2.8-3.3 2.8 0-3.3-1-6.3-3.5-8.3 0 4.3-4.5 6.3-4.5 11.5 0 4.2 2.7 7.5 8 7.5z'),
 bang:fl('M12 1l2.3 6.2L20 4l-2.2 6 5.7 2-5.7 2 2.2 6-5.7-3.2L12 23l-2.3-6.2L4 20l2.2-6L.5 12l5.7-2L4 4l5.7 3.2z'),
 search:stk('<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>'),
 trophy:stk('<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8M10 18h4"/>'),
 doc:stk('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>'),
 chest:stk('<path d="M3 11h18v9H3z"/><path d="M3 11a9 6 0 0 1 18 0"/><rect x="10" y="12" width="4" height="4" rx="1"/>'),
 chute:stk('<path d="M3 11a9 8 0 0 1 18 0z"/><path d="M3 11l8 10M21 11l-8 10M12 11v10"/>'),
 clock:stk('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>'),
 cloud:stk('<path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5 4.5 4.5 0 0 1 17 18z"/>'),
 planet:stk('<circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(-20 12 12)"/>'),
 sunset:stk('<path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 6v3M4.5 10.5l2 2M19.5 10.5l-2 2"/>'),
 lv1:stk('<path d="M6 19v-4"/><path d="M12 19v-9" opacity=".3"/><path d="M18 19V5" opacity=".3"/>'),
 lv2:stk('<path d="M6 19v-4"/><path d="M12 19v-9"/><path d="M18 19V5" opacity=".3"/>'),
 lv3:stk('<path d="M6 19v-4"/><path d="M12 19v-9"/><path d="M18 19V5"/>')};
const ic=(n,c)=>'<svg class="ic'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+(ICONS[n]||'')+'</svg>';
const hset=(id,h)=>{const e=$(id);if(e._h!==h){e._h=h;e.innerHTML=h}};
const THEMES={
 classic:{n:'Classic Sky Patrol',short:'Classic Sky',icon:'cloud',craft:'plane',dest:'Secret Scientist Island',hz:['bird','storm'],sky:['#8fd3ff','#d6f1ff','#fff3d6']},
 space:{n:'Space Explorer',short:'Space',icon:'planet',craft:'rocket',dest:'Alien Moon Base',hz:['asteroid','ufo'],sky:['#0a0530','#2b1166','#6a2f8f']},
 sunset:{n:'Sunset Recon',short:'Sunset',icon:'sunset',craft:'jet',dest:'Secret Scientist Island',hz:['bird','storm'],sky:['#3a2a6d','#c9507b','#ffb067']}};
const DIFFS={
 easy:{n:'Cadet',icon:'lv1',d:'Slower flight, bigger pickup zones, extra clue words.',spd:.75,spawn:[.8,1.3],haz:.25,hit:1.3,hint:2,qtime:0,cruise:12},
 medium:{n:'Pilot',icon:'lv2',d:'Balanced speed and standard clues.',spd:1,spawn:[.5,.9],haz:.38,hit:1,hint:1,qtime:0,cruise:12},
 hard:{n:'Ace',icon:'lv3',d:'Fast flight, quick obstacles, 60 s answer timer, fewer clues.',spd:1.4,spawn:[.3,.6],haz:.5,hit:.85,hint:0,qtime:60,cruise:10}};
let theme=LS.g('sp_theme','classic'),diff=LS.g('sp_diff','medium');
if(!THEMES[theme])theme='classic';if(!DIFFS[diff])diff='medium';

const TYPES={complete:'Complete the sentence',give_reason:'Give reason for',what_happens:'What happens if',correct:'Correct the mistake',mcq:'Multiple choice'};
const TCOL={complete:'#22b8f0',give_reason:'#7b5cff',what_happens:'#ff8a3c',correct:'#e0457b',mcq:'#2fbf71'};
const HINT={complete:'Type the missing word or term…',give_reason:'Type your full sentence explanation here…',what_happens:'Type what would happen, and why…',correct:'Type the corrected word or sentence…'};
const MINW={complete:1,correct:1,give_reason:3,what_happens:3};
const OLD={'Give reason for':'give_reason','What happens if':'what_happens'};
const DEFAULT_Q=[
{type:'give_reason',prompt:'Wood floats on the surface of water.',modelAnswer:'Wood floats because its density is less than the density of water.',requiredKeywords:'densit, less|lower|smaller, water'},
{type:'complete',prompt:'Plants make their food by a process called ________.',modelAnswer:'photosynthesis',requiredKeywords:'photosynth'},
{type:'what_happens',prompt:'A green plant is kept in complete darkness for many days.',modelAnswer:'The plant cannot make food by photosynthesis without light, so its leaves turn yellow and the plant becomes weak.',requiredKeywords:'photosynth|food, light|sunlight, yellow|weak|die|pale'},
{type:'mcq',prompt:'Which gas do plants take in for photosynthesis?',options:['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'],correctIndex:1,modelAnswer:'Plants take in carbon dioxide and use it to make food.'},
{type:'give_reason',prompt:'We see lightning before we hear thunder.',modelAnswer:'Light travels much faster than sound, so the light reaches us first.',requiredKeywords:'light, faster|quicker|greater, sound'},
{type:'correct',prompt:'Correct the mistake: "The Sun revolves around the Earth."',modelAnswer:'The Earth revolves around the Sun.',requiredKeywords:'earth revolv|earth orbit|earth goes around|earth moves around|earth travels around, around the sun'},
{type:'what_happens',prompt:'An iron nail is left outside in damp air for a long time.',modelAnswer:'It rusts, because iron reacts with oxygen and water to form iron oxide.',requiredKeywords:'rust, oxygen|air, water|moisture|damp'}];
function migrate(a){return(Array.isArray(a)?a:[]).map(q=>({type:TYPES[q.type]?q.type:(OLD[q.type]||'give_reason'),prompt:String(q.prompt||''),modelAnswer:String(q.modelAnswer||''),requiredKeywords:String(q.requiredKeywords||''),options:(Array.isArray(q.options)?q.options.map(String):[]).concat(['','','','']).slice(0,4),correctIndex:+q.correctIndex||0}))}
function prep(q){
  if(!q||!String(q.prompt).trim())return null;
  if(q.type==='mcq'){const ix=[];q.options.forEach((o,i)=>{if(String(o).trim())ix.push(i)});const c=ix.indexOf(q.correctIndex);
    return ix.length>=2&&c>=0?{...q,options:ix.map(i=>String(q.options[i]).trim()),correctIndex:c}:null}
  return q.requiredKeywords.replace(/[,|]/g,'').trim()&&q.modelAnswer.trim()?q:null}
let Q=migrate(LS.g('sp_q',null)||DEFAULT_Q);
const saveQ=()=>LS.s('sp_q',Q);

/* ---------- helpers ---------- */
const hash=s=>{let h=0x811c9dc5;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>' '+String(s).toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').trim()+' ';
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* ---------- student links ---------- */
const sign=(n,c,q,u,x)=>hash([n,c,q||'',u||'',x||'',SALT].join('|'));
const b64e=o=>{let s='';new TextEncoder().encode(JSON.stringify(o)).forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64d=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t),c=>c.charCodeAt(0))))};
const pack=qs=>b64e(qs.map(prep).filter(Boolean).map(q=>[q.type,q.prompt,q.modelAnswer,q.requiredKeywords,q.options,q.correctIndex]));
const unpack=t=>migrate(b64d(t).map(a=>({type:a[0],prompt:a[1],modelAnswer:a[2],requiredKeywords:a[3],options:a[4],correctIndex:a[5]})));
const xs=(h,d)=>h||d?h+'.'+d:'';
function makeLink(base,name,qs,url,o){o=o||{};const c=hash(name).slice(0,4),q=pack(qs),u=url||'',h=THEMES[o.h]?o.h:'',d=DIFFS[o.d]?o.d:'';
  return base+'?student='+encodeURIComponent(name)+'&code='+c+'&sig='+sign(name,c,q,u,xs(h,d))+'&q='+q+(u?'&u='+encodeURIComponent(u):'')+(h?'&h='+h:'')+(d?'&d='+d:'')}
function parseLink(search){const p=new URLSearchParams(search);if(!['student','code','sig','q','u','h','d'].some(k=>p.has(k)))return null;
  const n=p.get('student')||'',c=p.get('code')||'',q=p.get('q')||'',u=p.get('u')||'',h=p.get('h')||'',d=p.get('d')||'',ok=!!n&&p.get('sig')===sign(n,c,q,u,xs(h,d));let qs=null;
  if(ok&&q){try{qs=unpack(q).filter(prep)}catch(e){}}
  return{name:n,ok,questions:qs&&qs.length?qs:null,url:ok?u:'',theme:ok&&THEMES[h]?h:'',level:ok&&DIFFS[d]?d:''}}
const portalAllowed=search=>!parseLink(search);
const isTyping=el=>!!el&&(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||!!el.isContentEditable);
const overlayOpen=()=>['gate','qov','eov','por'].some(i=>{const e=$(i);return e&&e.classList.contains('on')});

/* ---------- keyword engine ---------- */
function evaluate(q,text){
  const n=norm(text),groups=String(q.requiredKeywords).split(',').map(g=>g.split('|').map(a=>norm(a).trim()).filter(Boolean)).filter(g=>g.length);
  const hits=[],miss=[];
  groups.forEach(g=>{const f=g.find(a=>n.includes(a));f?hits.push(f):miss.push(g)});
  let html=esc(text);
  if(hits.length)html=html.replace(new RegExp('('+hits.map(rx).join('|')+')[a-z]*','gi'),m=>'<mark>'+m+'</mark>');
  const short=n.trim().split(' ').filter(Boolean).length<(MINW[q.type]||3);
  return{pass:groups.length>0&&!miss.length&&!short,miss,html,short};
}
function grade(q,ans){
  if(q.type==='mcq'){const o=q.options[+ans];return{pass:+ans===q.correctIndex,miss:[],short:false,html:esc(o||''),text:o==null?'':String.fromCharCode(65+ +ans)+') '+o}}
  return evaluate(q,ans);
}
function applyResult(s,pass){if(pass){const r=s.wrong>0;s.pts+=100;s.wrong=0;return r}s.wrong++;return false}
const route=(wrong,pass,qi,len)=>wrong>=3?'crash':qi>=len?(pass?'landing':'repair'):pass?'boost':'next';
const buildRecord=(student,attempt,s,ok)=>({student,attempt,score:s.pts+' pts, '+s.stars+' stars',level:s.lv||'',theme:s.th||'',timeSec:Math.round(s.time),details:s.res.map(d=>({type:d.type,prompt:d.prompt,answer:d.answer,model:d.model,result:d.result})),date:new Date().toISOString(),completed:ok});

/* ---------- audio ---------- */
let AC;const ac=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC};
function tone(f,d,type='sine',v=.15,delay=0,slide){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
const sfx={
 star:()=>{tone(880,.1,'triangle',.12);tone(1320,.12,'triangle',.1,.07)},
 hit:()=>tone(160,.25,'sawtooth',.15,0,60),
 siren:()=>{for(let i=0;i<4;i++)tone(i%2?620:880,.25,'square',.06,i*.28)},
 win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.1)),
 wrong:()=>{tone(300,.5,'sawtooth',.14,0,90);tone(220,.5,'square',.08,.15,70)},
 boom:()=>tone(120+Math.random()*80,.4,'sawtooth',.1,0,40),
 fanfare:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.16))
};

function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}

const LINK=parseLink(location.search);

const rnd=(a,b)=>a+Math.random()*(b-a);
const clouds=Array.from({length:9},()=>({x:rnd(0,1),y:rnd(.05,.85),s:rnd(.6,1.6),v:rnd(8,24)}));
function freshState(){return{ph:'cruise',t:0,qi:0,n:0,wrong:0,stars:0,pts:0,time:0,px:W*.25,py:H*.5,tilt:0,objs:[],parts:[],boost:0,flash:0,flashC:'#2fbf71',spawn:0,ang:0,res:[],island:0,wt:0,prop:0,msg:'',msgT:0,over:false,fw:0,qt:0,df:DIFFS[diff],lv:diff,th:theme}}

function burst(x,y,n,cols,sp=240){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(40,sp);S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.6,1.4),m:1.4,r:rnd(3,7),c:cols[i%cols.length],g:200,k:'d'})}}

/* ---------- game logic ---------- */
function update(dt){
  if(!S.over)S.time+=dt;S.prop+=dt*40;
  const sp=S.boost>0?2.6:1,wrongSlow=S.wrong>=2?.8:1;
  clouds.forEach(c=>{c.x-=c.v*sp*dt/W;if(c.x<-.3)c.x=1.2});
  const playing=['cruise','ask','fb','boost'].includes(S.ph);
  if(playing){
    let dx=0,dy=0;const sp2=300*wrongSlow;
    if(keys.ArrowLeft||keys.a||keys.left)dx-=1;if(keys.ArrowRight||keys.d||keys.right)dx+=1;
    if(keys.ArrowUp||keys.w||keys.up)dy-=1;if(keys.ArrowDown||keys.s||keys.down)dy+=1;
    if(!(S.ph==='cruise'||S.ph==='boost')){dx=0;dy=0;tgt=null}
    if(dx||dy){S.px+=dx*sp2*dt;S.py+=dy*sp2*dt;tgt=null}
    else if(tgt){S.px+=(tgt.x-S.px)*Math.min(1,dt*7);S.py+=(tgt.y-S.py)*Math.min(1,dt*7)}
    if(S.wrong>=2)S.py+=28*dt;
    S.px=Math.max(50,Math.min(W*.65,S.px));S.py=Math.max(60,Math.min(H-60,S.py));
    S.tilt+=((dy*.3+(S.wrong>=2?.1:0))-S.tilt)*dt*6;
    if(S.wrong>=1&&Math.random()<.5)smoke(S.px-10,S.py-10,S.wrong>=2?'#333':'#777');
    if(S.wrong>=2&&Math.random()<.6)smoke(S.px+42,S.py+4,'#222');
    if(S.boost>0){S.boost-=dt;if(Math.random()<.8)S.parts.push({x:S.px-40,y:S.py+rnd(-6,6),vx:-300,vy:rnd(-20,20),l:.5,m:.5,r:rnd(4,9),c:'#ffc93c',g:0,k:'s'})}
  }
  if(S.ph==='cruise'||S.ph==='boost'){
    S.t+=dt;S.spawn-=dt;
    if(S.spawn<=0&&S.ph==='cruise'){const D=S.df;S.spawn=rnd(D.spawn[0],D.spawn[1]);
      const k=Math.random()<D.haz?TH().hz[Math.random()<.5?0:1]:(Math.random()<.8?'star':'fuel');S.objs.push({k,x:W+60,y:rnd(70,H-70),v:rnd(150,230)*D.spd,wob:rnd(0,6),rot:rnd(0,6)})}
    if(S.ph==='cruise'&&S.t>=S.df.cruise)ask();
    if(S.ph==='boost'&&S.boost<=0)afterBoost();
  }
  S.objs.forEach(o=>{o.x-=o.v*sp*dt;o.wob+=dt*4;if(o.k==='bird'||o.k==='ufo')o.y+=Math.sin(o.wob)*(o.k==='ufo'?55:40)*dt;if(o.k==='asteroid')o.rot+=dt*1.5});
  if(S.ph==='cruise'||S.ph==='boost')S.objs.forEach(o=>{
    if(o.dead)return;const good=o.k==='star'||o.k==='fuel',R=good?36*S.df.hit:({storm:48,asteroid:40,ufo:42}[o.k]||32)/S.df.hit;
    if(Math.hypot(o.x-S.px,o.y-S.py)<R){o.dead=true;
      if(good){S.stars++;S.pts+=o.k==='fuel'?20:10;sfx.star();burst(o.x,o.y,10,['#ffc93c','#fff'],160)}
      else{S.pts=Math.max(0,S.pts-5);S.flash=.3;S.flashC='#ff5a5f';sfx.hit();burst(o.x,o.y,10,['#aaa','#fff'],140);say('Bump! -5 points',1)}}});
  S.objs=S.objs.filter(o=>!o.dead&&o.x>-60);
  if(S.ph==='landing'){
    S.wt+=dt;S.island=Math.min(1,S.wt/2);
    const lx=W*.62,ly=H*.78-24;
    S.px+=(lx-S.px)*dt*.9;S.py+=(ly-S.py)*dt*.9;S.tilt=.12;
    if(S.wt>4.2)win();
  }
  if(S.ph==='crash'){
    S.wt+=dt;S.ang+=dt*9;S.py+=dt*(S.wt<1.6?260:50);S.px+=dt*30;
    if(Math.random()<.9)smoke(S.px,S.py,'#222');
    if(S.py>H-90){S.py=H-90}
    if(S.wt>4.5&&!S.over)lose();
  }
  if(S.ph==='win'){S.wt+=dt;S.fw-=dt;if(S.fw<=0){S.fw=.35;const x=rnd(W*.1,W*.9),y=rnd(H*.1,H*.5),c=['#ff5a5f','#ffc93c','#2fbf71','#7b5cff','#22b8f0'];burst(x,y,28,[c[Math.floor(rnd(0,5))],'#fff'],260);sfx.boom()}if(Math.random()<.2)confetti()}
  S.parts.forEach(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.k==='r')p.vx+=Math.sin(p.y/30)*20*dt});
  S.parts=S.parts.filter(p=>p.l>0&&p.y<H+20);
  if(S.flash>0)S.flash-=dt;if(S.msgT>0)S.msgT-=dt;
  if(S.ph==='ask'&&S.df.qtime){S.qt-=dt;hset('qtm',ic('clock')+' '+Math.max(0,Math.ceil(S.qt))+' s');if(S.qt<=0)submitQ(true)}
  hset('hQ',ic('flag')+' '+(S.qi<S.n?(S.qi+1)+'/'+S.n:S.qi<QP.length?'Repair':S.n+'/'+S.n));
  hset('hS',ic('star')+' '+S.stars+' &middot; '+S.pts+' pts');
  hset('hH',[0,1,2].map(i=>ic('heart',i<3-S.wrong?'hp':'hp lost')).join(''));
}

const curDf=()=>S&&!S.over?S.df:DIFFS[diff];
const ideas=q=>String(q.requiredKeywords).split(',').filter(g=>g.replace(/\|/g,'').trim()).length;
function showQ(q,pv){
  const m=q.type==='mcq',D=curDf(),n=ideas(q);$('qt').textContent=TYPES[q.type];$('qt').style.background=TCOL[q.type];$('qp').textContent=q.prompt;
  $('qh').innerHTML=!pv&&!m&&D.hint===2?ic('radar')+' Hint: your answer needs '+n+' key idea'+(n>1?'s':'')+'.':'';
  $('qa').style.display=m?'none':'';$('qa').value='';$('qa').disabled=!!pv;$('qa').placeholder=HINT[q.type]||'';
  $('qopts').innerHTML=m?q.options.map((o,i)=>`<label class="opt"><input type="radio" name="mc" value="${i}"${pv&&i===q.correctIndex?' checked':''}${pv?' disabled':''}><span><b>${String.fromCharCode(65+i)}</b> ${esc(o)}</span></label>`).join(''):'';
  $('qf').innerHTML='';$('qs').style.display=pv?'none':'';$('qs').innerHTML=ic('radar')+' Transmit code';$('qs').dataset.mode='send';$('qx').style.display=pv?'':'none';
  const tm=!pv&&D.qtime>0&&!!S;$('qtm').hidden=!tm;if(tm){S.qt=D.qtime;$('qtm').innerHTML=ic('clock')+' '+D.qtime+' s'}
  $('qbox').classList.remove('shake');$('qov').classList.add('on');if(!pv&&!m)setTimeout(()=>$('qa').focus(),300);
}
function ask(){S.ph='ask';keys={};tgt=null;S.objs=S.objs.filter(o=>o.x>0);sfx.siren();S.flash=.6;S.flashC='#ff5a5f';showQ(QP[S.qi])}
function submitQ(force){
  if(!S||S.ph!=='ask')return;
  const q=QP[S.qi],m=q.type==='mcq',D=S.df;let ans,r;
  if(m){const c=document.querySelector('#qopts input:checked');if(!c&&!force){$('qf').innerHTML='<div class="fb bad">Pick an answer first.</div>';return}ans=c?+c.value:-1}
  else{ans=$('qa').value;if(!ans.trim()&&!force){$('qa').focus();return}}
  r=grade(q,ans);
  if(!force&&r.short){$('qf').innerHTML='<div class="fb bad">Write a little more: at least '+MINW[q.type]+' word'+(MINW[q.type]>1?'s':'')+'. No damage for this one!</div>';return}
  if(force)r.pass=false;
  const given=m?(r.text||'(no answer)'):(ans.trim()?ans:'(no answer)');
  S.res.push({type:q.type,prompt:q.prompt,answer:given,model:m?q.options[q.correctIndex]:q.modelAnswer,result:r.pass?'pass':'fail'});
  $('qa').disabled=true;$('qtm').hidden=true;document.querySelectorAll('#qopts input').forEach(i=>i.disabled=true);
  if(m)document.querySelectorAll('#qopts .opt').forEach((l,i)=>{if(i===q.correctIndex)l.classList.add('good');else if(i===ans)l.classList.add('badopt')});
  S.ph='fb';const fixed=applyResult(S,r.pass),you=m?esc(r.text||'(no answer)'):(r.html||'(no answer)'),mod=esc(m?q.options[q.correctIndex]+(q.modelAnswer?' - '+q.modelAnswer:''):q.modelAnswer);
  if(r.pass){sfx.win();S.flash=.5;S.flashC='#2fbf71';burst(S.px,S.py,40,['#ffc93c','#fff','#2fbf71'],320);if(fixed)say('Craft fully repaired!',2.5);
    $('qf').innerHTML='<div class="fb ok"><b>System Repaired &amp; Clearance Granted! '+ic('star')+'</b><br>Your answer: '+you+'<br><small>Model answer: '+mod+'</small></div>'}
  else{sfx.wrong();$('qbox').classList.add('shake');S.flash=.5;S.flashC='#ff5a5f';
    const dmg=S.wrong===1?ic('warn')+' Wing Damaged! Warning!':S.wrong===2?ic('flame')+' Critical Damage! Engine failed!':ic('bang')+' Mission Failed - Try Again!';
    const ms=r.miss,clue=m?'The right choice was <b>'+esc(String.fromCharCode(65+q.correctIndex)+') '+q.options[q.correctIndex])+'</b>':force?'Time ran out before you transmitted.':D.hint===2?'Missing clues: <b>'+esc(ms.map(g=>g.join(' / ')).join('; '))+'</b>':D.hint===1?'Missing clue: <b>'+esc(ms[0]?ms[0].join(' / '):'')+'</b>':'You missed '+ms.length+' key idea'+(ms.length>1?'s':'')+'.';
    $('qf').innerHTML='<div class="fb bad"><b>'+dmg+'</b><br>'+ic('search')+' '+clue+'<br>Your answer: '+you+'<br><b>Model answer:</b> '+mod+'</div>'}
  $('qs').innerHTML=ic('plane')+' Continue';$('qs').dataset.mode='go';
}
function afterQ(){
  if(!S||S.ph!=='fb')return;
  $('qov').classList.remove('on');
  const pass=S.res[S.res.length-1].result==='pass';S.qi++;
  const r=route(S.wrong,pass,S.qi,QP.length);
  if(r==='crash'){crash();return}
  if(r==='repair'){QP.push(QP[S.qi-1]);say('Repair checkpoint: try it again!',2.5)}
  S.ph='boost';S.boost=pass?2.5:.01;if(pass)say('TURBO BOOST!',2);
}
function afterBoost(){
  if(S.qi>=QP.length){S.ph='landing';S.wt=0;S.objs=[];say(TH().dest+' ahead!',3);return}
  S.ph='cruise';S.t=0;S.spawn=.3;
}
function crash(){S.ph='crash';S.wt=0;S.ang=0;S.objs=[];sfx.wrong();say('Mission Failed — parachute landing!',3)}

function finish(ok){
  S.over=true;
  const att=LS.g('sp_att',{});att[student]=(att[student]||0)+1;LS.s('sp_att',att);
  const rec=buildRecord(student,att[student],S,ok),log=LS.g('sp_log',[]);log.push(rec);LS.s('sp_log',log);
  const url=syncUrl();
  if(url){try{fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}).catch(()=>{})}catch(e){}}
}

/* ---------- drawing ---------- */
const TH=()=>THEMES[theme]||THEMES.classic;
function path(pts){cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath()}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function starShape(r){cx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;cx.lineTo(Math.cos(a)*q,Math.sin(a)*q)}cx.closePath()}
const bgStars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:rnd(.6,2.2),v:rnd(4,30),p:rnd(0,6)}));
let shoot=[];
function bgStep(dt){bgStars.forEach(b=>{b.x-=b.v*dt/W;if(b.x<0)b.x+=1});
  if(theme==='space'&&Math.random()<dt*.5)shoot.push({x:rnd(W*.3,W),y:rnd(0,H*.5),vx:-rnd(500,800),vy:rnd(200,400),l:.9});
  shoot.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt});shoot=shoot.filter(b=>b.l>0)}
function drawObj(o){
  cx.save();cx.translate(o.x,o.y);const k=o.k;cx.lineWidth=3;cx.strokeStyle='#23395b';cx.lineJoin='round';
  if(k==='star'){cx.shadowColor='#ffc93c';cx.shadowBlur=18;cx.fillStyle='#ffd93d';cx.rotate(Math.sin(o.wob)*.25);starShape(24);cx.fill();cx.stroke()}
  else if(k==='fuel'){cx.shadowColor='#ffc93c';cx.shadowBlur=14;cx.fillStyle='#ff5a5f';rr(-15,-18,30,36,6);cx.fill();cx.stroke();cx.fillStyle='#fff';cx.fillRect(-15,-4,30,8);cx.fillStyle='#23395b';cx.fillRect(-6,-26,12,8);cx.fillRect(6,-24,10,4)}
  else if(k==='bird'){const f=Math.sin(o.wob*2.5)*10;cx.lineCap='round';cx.lineWidth=5;cx.beginPath();cx.moveTo(-26,-f);cx.quadraticCurveTo(-12,-18+f,0,0);cx.quadraticCurveTo(12,-18+f,26,-f);cx.stroke();
    cx.fillStyle='#7b5cff';cx.beginPath();cx.ellipse(0,3,12,8,0,0,7);cx.fill();cx.fillStyle='#ffc93c';path([[-11,2],[-20,5],[-11,7]]);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(-6,1,2.5,0,7);cx.fill()}
  else if(k==='storm'){cx.fillStyle='#5b6b86';cx.beginPath();[[-30,6,22],[-8,-8,26],[18,2,24],[34,10,16],[-22,14,18],[8,16,20]].forEach(([a,b,r])=>{cx.moveTo(a+r,b);cx.arc(a,b,r,0,7)});cx.fill();cx.fillStyle='#ffd93d';path([[2,14],[-10,34],[0,32],[-6,50],[14,26],[3,28],[10,14]]);cx.fill()}
  else if(k==='asteroid'){cx.rotate(o.rot);cx.fillStyle='#8a7f8f';path([[-30,-6],[-18,-26],[6,-30],[28,-14],[30,10],[12,28],[-14,26],[-28,14]]);cx.fill();cx.stroke();cx.fillStyle='#6d6475';[[-8,-8,6],[10,6,8],[-12,12,4]].forEach(([a,b,r])=>{cx.beginPath();cx.arc(a,b,r,0,7);cx.fill()})}
  else if(k==='ufo'){cx.fillStyle='#9fe3ff';cx.beginPath();cx.ellipse(0,-8,16,14,0,Math.PI,0);cx.fill();cx.fillStyle='#b8c4d9';cx.beginPath();cx.ellipse(0,2,36,12,0,0,7);cx.fill();cx.stroke();cx.fillStyle=Math.sin(o.wob*3)>0?'#ffd93d':'#ff5a5f';[-20,0,20].forEach(a=>{cx.beginPath();cx.arc(a,3,3.5,0,7);cx.fill()})}
  cx.restore();
}
function planeArt(wing,eng,prop){
  cx.fillStyle='#ff5a5f';cx.beginPath();cx.moveTo(-40,-4);cx.lineTo(-62,-26);cx.lineTo(-52,-26);cx.lineTo(-24,-4);cx.fill();
  cx.beginPath();cx.moveTo(-58,0);cx.lineTo(-30,4);cx.lineTo(-58,10);cx.fill();
  cx.fillStyle=wing>=1?'#b9402f':'#ffc93c';cx.beginPath();cx.ellipse(-4,-14,26,8,-.35,0,7);cx.fill();
  cx.fillStyle='#ff5a5f';cx.beginPath();cx.ellipse(0,4,48,19,0,0,7);cx.fill();cx.stroke();
  cx.fillStyle='#fffdf7';cx.beginPath();cx.ellipse(-4,6,28,6,0,0,7);cx.fill();
  cx.fillStyle='#9fe3ff';cx.beginPath();cx.arc(8,-6,10,0,7);cx.fill();cx.stroke();cx.fillStyle='#fff';cx.beginPath();cx.arc(5,-9,3,0,7);cx.fill();
  cx.fillStyle=wing>=1?'#d9553d':'#ffd55e';cx.beginPath();cx.ellipse(-2,16,32,9,.3,0,7);cx.fill();cx.stroke();

      log.forEach(r=>r.details.forEach(d=>rows.push([r.date,r.student,r.attempt,r.score,r.timeSec,d.prompt,d.answer,d.model,d.result,r.level||'',r.theme||''])));
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='skypilot-results.csv';a.click()};
    $('clr').onclick=()=>{if(confirm('Delete the log stored on this device?')){LS.s('sp_log',[]);portal()}};
  }
}
function defaultsHTML(){const d=LS.g('sp_def',{h:'classic',d:'medium'}),o=(O,v)=>Object.entries(O).map(([k,x])=>'<option value="'+k+'"'+(v===k?' selected':'')+'>'+x.n+'</option>').join('');
  return '<div class="row" style="margin:0 0 8px"><label style="flex:1">Starting theme<select id="dth">'+o(THEMES,d.h)+'</select></label><label style="flex:1">Starting level<select id="ddf">'+o(DIFFS,d.d)+'</select></label></div>'}
function preview(q){
  const p=prep(q);if(!p){alert('This question is incomplete. Fill in the prompt and its answer details first.');return}
  showQ(p,true);
  $('qf').innerHTML='<div class="fb ok"><small>'+(p.type==='mcq'?'Correct option is ticked. Explanation: ':'Model answer: ')+'</small>'+esc(p.modelAnswer)+(p.type==='mcq'?'':'<br><small>Keywords: '+esc(p.requiredKeywords)+'</small>')+'</div>';
}
function runSelfTests(){
  const T=[],t=(n,f)=>{try{const r=f();T.push([n,r===true,r===true?'':'returned '+r])}catch(e){T.push([n,false,e.message])}};
  const M=migrate(DEFAULT_Q),written=M.filter(q=>q.type!=='mcq'),mq=M.find(q=>q.type==='mcq'),gr=M.find(q=>q.type==='give_reason'),co=M.find(q=>q.type==='correct'),cm=M.find(q=>q.type==='complete');
  t('Keys are ignored while typing in inputs',()=>isTyping({tagName:'TEXTAREA'})&&isTyping({tagName:'INPUT'})&&isTyping({tagName:'SELECT'})&&!isTyping({tagName:'DIV'}));
  t('Plane does not steer while a question is open',()=>{const sS=S,sK=keys;try{S=freshState();S.ph='ask';keys={ArrowLeft:true,w:true};const x=S.px,y=S.py;update(.1);return S.px===x&&S.py===y}finally{S=sS;keys=sK}});
  t('Every sample model answer passes its own keywords',()=>written.every(q=>grade(q,q.modelAnswer).pass)||'a sample failed');
  t('Give-reason grading: right passes, vague fails',()=>grade(gr,'Wood floats because its density is less than water').pass&&!grade(gr,'Wood is light').pass);
  t('Matched keywords are highlighted',()=>/<mark>/.test(grade(gr,'Its density is lower than water').html));
  t('Correct-the-mistake respects word order',()=>grade(co,'The Earth revolves around the Sun.').pass&&!grade(co,'The Sun revolves around the Earth.').pass);
  t('Complete-the-sentence accepts a single term',()=>grade(cm,'Photosynthesis').pass&&!grade(cm,'respiration').pass);
  t('MCQ grading uses the selected option',()=>{const p=prep(mq),a=grade(p,1);return a.pass&&!grade(p,0).pass&&a.text==='B) Carbon dioxide'});
  t('Too-short written answers are flagged, not graded',()=>grade(gr,'yes').short===true);
  t('Damage and repair sequence',()=>{const s={wrong:0,pts:0};applyResult(s,false);applyResult(s,false);const two=s.wrong===2,fixed=applyResult(s,true);return two&&fixed===true&&s.wrong===0&&s.pts===100});
  t('Routing: crash, repair, landing, boost, next',()=>[route(3,false,2,5),route(1,false,5,5),route(0,true,5,5),route(0,true,2,5),route(1,false,2,5)].join()==='crash,repair,landing,boost,next');
  t('Student link decodes all 5 question types',()=>{const l=makeLink('http://x/','Ana Ö',M,'https://script.google.com/x/exec',{h:'space',d:'hard'}),r=parseLink(l.split('?')[1]);return !!r&&r.ok&&!!r.questions&&r.questions.length===M.filter(prep).length&&new Set(r.questions.map(q=>q.type)).size===5&&r.url.endsWith('/exec')&&r.name==='Ana Ö'&&r.theme==='space'&&r.level==='hard'});
  t('Tampered link is rejected, student mode kept',()=>{const l=makeLink('http://x/','Ana',M,'').replace('student=Ana','student=Bob'),r=parseLink(l.split('?')[1]);return !!r&&!r.ok&&!r.questions});
  t('Corrupt question data falls back without crashing',()=>{const n='Ana',c=hash(n).slice(0,4),q='@@@',r=parseLink('student=Ana&code='+c+'&sig='+sign(n,c,q,'')+'&q='+q);return !!r&&r.ok&&r.questions===null});
  t('Teacher Portal only on the plain master URL',()=>portalAllowed('')&&portalAllowed('?x=1')&&!portalAllowed('?student=Ana&code=1&sig=x')&&!portalAllowed('?code=1'));
  t('Log payload formats MCQ and typed answers',()=>{const rec=buildRecord('Ana',2,{pts:150,stars:3,time:41.4,res:[{type:'mcq',prompt:'p',answer:'B) Carbon dioxide',model:'Carbon dioxide',result:'pass'},{type:'give_reason',prompt:'q',answer:'Exact typed text, with Capitals!',model:'m',result:'fail'}]},false),d=rec.details;
    return rec.student==='Ana'&&rec.attempt===2&&rec.score==='150 pts, 3 stars'&&rec.timeSec===41&&d[0].answer==='B) Carbon dioxide'&&d[1].answer==='Exact typed text, with Capitals!'&&d[1].result==='fail'&&/^\d{4}-\d\d-\d\dT/.test(rec.date)&&JSON.parse(JSON.stringify(rec)).details.length===2});
  t('Replay starts from a clean state',()=>{const a=freshState();a.pts=99;a.wrong=2;a.stars=5;a.time=50;a.res.push(1);a.objs.push(1);a.boost=3;const b=freshState();return b.pts===0&&b.wrong===0&&b.stars===0&&b.time===0&&b.boost===0&&b.res.length===0&&b.objs.length===0&&b.ph==='cruise'&&b.res!==a.res});
  t('Levels scale speed, hit zones, spawns, clues and timer',()=>{const e=DIFFS.easy,m=DIFFS.medium,h=DIFFS.hard;return e.spd<m.spd&&m.spd<h.spd&&e.hit>m.hit&&m.hit>h.hit&&e.spawn[0]>m.spawn[0]&&m.spawn[0]>h.spawn[0]&&e.hint>m.hint&&m.hint>h.hint&&!e.qtime&&h.qtime>0&&h.cruise<e.cruise});
  t('Switching theme or level leaves no old state behind',()=>{const sT=theme,sD=diff;try{theme='space';diff='hard';const a=freshState();a.res.push(1);a.objs.push(1);theme='classic';diff='easy';const b=freshState();return a.lv==='hard'&&a.th==='space'&&a.df===DIFFS.hard&&b.lv==='easy'&&b.th==='classic'&&b.df===DIFFS.easy&&b.objs.length===0&&b.res.length===0&&b.objs!==a.objs}finally{theme=sT;diff=sD}});
  t('Level and theme are logged',()=>{const r=buildRecord('Ana',1,{pts:0,stars:0,time:1,res:[],lv:'hard',th:'space'},true);return r.level==='hard'&&r.theme==='space'});
  t('Every theme, craft, hazard and scene draws without errors',()=>{const sS=S,sT=theme;try{for(const k in THEMES){theme=k;S=null;draw();S=freshState();S.objs=['star','fuel','bird','storm','asteroid','ufo'].map((kk,i)=>({k:kk,x:100+i*90,y:200,v:0,wob:i,rot:i}));
    for(const ph of['cruise','landing','crash','win']){S.ph=ph;S.island=1;S.wt=2;S.wrong=ph==='crash'?3:1;draw()}}return true}finally{S=sS;theme=sT}});
  t('Icons are inline SVG and no text emoji is on screen',()=>Object.keys(ICONS).every(k=>/^<(g|path)/.test(ICONS[k]))&&!/\p{Extended_Pictographic}/u.test(document.body.textContent));
  return T;
}
document.querySelectorAll('i[data-ic]').forEach(e=>{e.outerHTML=ic(e.dataset.ic)});renderPickers();
if($('tp')){$('tp').onclick=()=>{$('por').classList.add('on');portal()};$('pc').onclick=()=>$('por').classList.remove('on')}
