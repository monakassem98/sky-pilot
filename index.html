<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyPilot: Emergency Runway</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe8ff;--ink:#23395b;--red:#ff5a5f;--sun:#ffc93c;--grn:#2fbf71;--pur:#7b5cff;--card:#fffdf7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:var(--sky);touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:.7em 1.4em;background:var(--sun);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #d9a21a;transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a21a}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
button.sec{background:#fff;box-shadow:0 4px 0 #b9c7d9}
button.grn{background:var(--grn);color:#fff;box-shadow:0 4px 0 #1e8a50}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(35,57,91,.35);z-index:10;overflow:auto}
.ov.on{display:flex}
.box{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:20px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 0 rgba(35,57,91,.25)}
.box h1{margin:0 0 4px;font-size:clamp(28px,6vw,44px);line-height:1}
.box p{margin:.4em 0}
input,textarea,select{font:inherit;width:100%;padding:.6em .9em;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:.2em .8em;border-radius:999px;color:#fff;font-weight:700;font-size:14px}
.radar{display:flex;gap:10px;align-items:center;background:#16324f;color:#9dffb8;border-radius:18px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.radar i{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid #9dffb8;background:radial-gradient(circle,#9dffb8 0 3px,transparent 4px);animation:ping 1.2s infinite}
@keyframes ping{50%{box-shadow:0 0 0 8px rgba(157,255,184,.25)}}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
mark{background:#b6f5ce;border-radius:6px;padding:0 3px;color:#0b5c32}
.fb{margin-top:10px;padding:12px;border-radius:16px;font-size:15px}
.ok{background:#e1fbe9;border:3px solid var(--grn)}.bad{background:#fff0ee;border:3px solid var(--red)}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:none;justify-content:space-between;gap:8px;pointer-events:none;z-index:5;font-weight:700;font-size:clamp(14px,3.6vw,20px)}
#hud span{background:#fffd;border:3px solid var(--ink);border-radius:999px;padding:.2em .8em}
#pad{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;display:none;grid-template:repeat(2,52px)/repeat(3,52px);gap:6px;z-index:5}
#pad button{padding:0;font-size:22px;box-shadow:0 3px 0 #d9a21a;opacity:.85}
#pad .u{grid-area:1/2}#pad .l{grid-area:2/1}#pad .d{grid-area:2/2}#pad .r{grid-area:2/3}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{padding:.4em 1em;box-shadow:none;background:#e6eef7}.tabs button.on{background:var(--pur);color:#fff}
.q{border:3px solid #cdd9e8;border-radius:18px;padding:10px;margin:8px 0;background:#fff}
.q input,.q textarea,.q select{margin:3px 0;padding:.4em .7em;border-width:2px;border-radius:12px;font-size:15px}
.q textarea{min-height:48px}
pre{background:#16324f;color:#cfe;padding:12px;border-radius:14px;overflow:auto;font-size:12px;white-space:pre-wrap}
small{opacity:.75}
.lic{border:5px double #b8860b;background:linear-gradient(#fff8dc,#ffe9a8);border-radius:14px;padding:14px;margin:10px 0;text-align:center;transform:rotate(-1.5deg)}
.lic b{font-size:clamp(22px,5vw,32px);display:block;margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #cdd9e8;padding:4px;text-align:left;vertical-align:top}
@media (prefers-reduced-motion:reduce){.shake,.radar i{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="hQ"></span><span id="hS"></span><span id="hH"></span></div>
<div id="pad"><button class="u" data-k="up" aria-label="Up">▲</button><button class="l" data-k="left" aria-label="Left">◀</button><button class="d" data-k="down" aria-label="Down">▼</button><button class="r" data-k="right" aria-label="Right">▶</button></div>

<!-- GATE -->
<div class="ov on" id="gate"><div class="box" style="text-align:center">
<div style="font-size:64px;line-height:1">🛩️</div>
<h1>SkyPilot: Emergency Runway</h1>
<p>Fly through the clouds, grab stars, and answer science questions to keep your plane flying!</p>
<input id="nm" placeholder="Pilot name" maxlength="30" aria-label="Pilot name" style="text-align:center;margin:8px 0">
<small id="lockNote"></small>
<div class="row" style="justify-content:center"><button class="grn" id="go">Take off! ✈️</button><button class="sec" id="tp">Teacher Portal</button></div>
<p><small>Move: arrow keys / W A S D, or drag on the screen.</small></p>
</div></div>

<!-- QUESTION -->
<div class="ov" id="qov"><div class="box" id="qbox">
<div class="radar"><i></i><div>Tower calling SkyPilot! Engine overheating! Transmit scientific clearance code to stabilize!</div></div>
<span class="badge" id="qt"></span>
<h2 id="qp" style="margin:8px 0"></h2>
<textarea id="qa" placeholder="Type your full sentence explanation here…" aria-label="Your answer"></textarea>
<div class="row"><button class="grn" id="qs">Transmit code 📡</button><button class="sec" id="qx" style="display:none">Close preview</button></div>
<div id="qf"></div>
</div></div>

<!-- END -->
<div class="ov" id="eov"><div class="box" id="ebox" style="text-align:center"></div></div>

<!-- PORTAL -->
<div class="ov" id="por"><div class="box" style="width:min(820px,100%)">
<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:28px">👩‍🏫 Teacher Portal</h1><button class="sec" id="pc">Close</button></div>
<div class="tabs" id="tabs"></div>
<div id="pbody"></div>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SALT='skypilot-v1',CRUISE=12;
const DEFAULT_Q=[
{type:'Give reason for',prompt:'Wood floats on the surface of water.',modelAnswer:'Wood floats because its density is less than the density of water.',requiredKeywords:'densit, less|lower|smaller, water'},
{type:'What happens if',prompt:'A green plant is kept in complete darkness for many days.',modelAnswer:'The plant cannot make food by photosynthesis without light, so its leaves turn yellow and the plant becomes weak.',requiredKeywords:'photosynth|food, light|sunlight, yellow|weak|die|pale'},
{type:'Give reason for',prompt:'We see lightning before we hear thunder.',modelAnswer:'Light travels much faster than sound, so the light reaches us first.',requiredKeywords:'light, faster|quicker|greater, sound'},
{type:'What happens if',prompt:'An iron nail is left outside in damp air for a long time.',modelAnswer:'It rusts, because iron reacts with oxygen and water to form iron oxide.',requiredKeywords:'rust, oxygen|air, water|moisture|damp'}];
let Q=LS.g('sp_q',null)||DEFAULT_Q.slice();
const saveQ=()=>LS.s('sp_q',Q);

/* ---------- helpers ---------- */
const hash=s=>{let h=0x811c9dc5;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>' '+String(s).toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').trim()+' ';
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* ---------- keyword engine ---------- */
function evaluate(q,text){
  const n=norm(text),groups=q.requiredKeywords.split(',').map(g=>g.split('|').map(a=>a.trim().toLowerCase()).filter(Boolean)).filter(g=>g.length);
  const hits=[],miss=[];
  groups.forEach(g=>{const f=g.find(a=>n.includes(a));f?hits.push(f):miss.push(g)});
  let html=esc(text);
  if(hits.length){html=html.replace(new RegExp('('+hits.map(rx).join('|')+')[a-z]*','gi'),m=>'<mark>'+m+'</mark>')}
  return{pass:groups.length>0&&!miss.length&&text.trim().split(/\s+/).length>=3,miss,html,short:text.trim().split(/\s+/).length<3};
}

/* ---------- audio ---------- */
let AC;const ac=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC};
function tone(f,d,type='sine',v=.15,delay=0,slide){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
const sfx={
 star:()=>{tone(880,.1,'triangle',.12);tone(1320,.12,'triangle',.1,.07)},
 hit:()=>tone(160,.25,'sawtooth',.15,0,60),
 siren:()=>{for(let i=0;i<4;i++)tone(i%2?620:880,.25,'square',.06,i*.28)},
 win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.1)),
 wrong:()=>{tone(300,.5,'sawtooth',.14,0,90);tone(220,.5,'square',.08,.15,70)},
 boom:()=>tone(120+Math.random()*80,.4,'sawtooth',.1,0,40),
 fanfare:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.16))
};

/* ---------- canvas ---------- */
const cv=$('c'),cx=cv.getContext('2d');let W,H,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

/* ---------- state ---------- */
let S=null,keys={},tgt=null,last=0,student='';
const rnd=(a,b)=>a+Math.random()*(b-a);
const clouds=Array.from({length:9},()=>({x:rnd(0,1),y:rnd(.05,.85),s:rnd(.6,1.6),v:rnd(8,24)}));
function newGame(){
  S={ph:'cruise',t:0,qi:0,wrong:0,stars:0,pts:0,time:0,px:W*.25,py:H*.5,tilt:0,objs:[],parts:[],boost:0,flash:0,flashC:'#2fbf71',spawn:0,
     ang:0,res:[],island:0,wt:0,prop:0,msg:'',msgT:0,over:false,fw:0};
  tgt=null;$('hud').style.display='flex';$('pad').style.display=('ontouchstart' in window||navigator.maxTouchPoints>0)?'grid':'none';
}
function say(m,t=2){S.msg=m;S.msgT=t}
function burst(x,y,n,cols,sp=240){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(40,sp);S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.6,1.4),m:1.4,r:rnd(3,7),c:cols[i%cols.length],g:200,k:'d'})}}
function confetti(){for(let i=0;i<8;i++)S.parts.push({x:rnd(0,W),y:-10,vx:rnd(-40,40),vy:rnd(60,180),l:5,m:5,r:rnd(4,8),c:['#ff5a5f','#ffc93c','#2fbf71','#7b5cff','#22b8f0'][i%5],g:30,k:'r'})}
function smoke(x,y,c='#555'){S.parts.push({x,y,vx:rnd(-50,-20),vy:rnd(-30,10),l:1.1,m:1.1,r:rnd(5,10),c,g:-20,k:'s'})}

/* ---------- game logic ---------- */
function update(dt){
  S.time+=dt;S.prop+=dt*40;
  const sp=S.boost>0?2.6:1,wrongSlow=S.wrong>=2?.8:1;
  clouds.forEach(c=>{c.x-=c.v*sp*dt/W;if(c.x<-.3)c.x=1.2});
  const playing=['cruise','ask','fb','boost'].includes(S.ph);
  if(playing){
    let dx=0,dy=0;const sp2=300*wrongSlow;
    if(keys.ArrowLeft||keys.a||keys.left)dx-=1;if(keys.ArrowRight||keys.d||keys.right)dx+=1;
    if(keys.ArrowUp||keys.w||keys.up)dy-=1;if(keys.ArrowDown||keys.s||keys.down)dy+=1;
    if(dx||dy){S.px+=dx*sp2*dt;S.py+=dy*sp2*dt;tgt=null}
    else if(tgt){S.px+=(tgt.x-S.px)*Math.min(1,dt*7);S.py+=(tgt.y-S.py)*Math.min(1,dt*7)}
    if(S.wrong>=2)S.py+=28*dt;
    S.px=Math.max(50,Math.min(W*.65,S.px));S.py=Math.max(60,Math.min(H-60,S.py));
    S.tilt+=((dy*.3+(S.wrong>=2?.1:0))-S.tilt)*dt*6;
    if(S.wrong>=1&&Math.random()<.5)smoke(S.px-10,S.py-10,S.wrong>=2?'#333':'#777');
    if(S.wrong>=2&&Math.random()<.6)smoke(S.px+42,S.py+4,'#222');
    if(S.boost>0){S.boost-=dt;if(Math.random()<.8)S.parts.push({x:S.px-40,y:S.py+rnd(-6,6),vx:-300,vy:rnd(-20,20),l:.5,m:.5,r:rnd(4,9),c:'#ffc93c',g:0,k:'s'})}
  }
  if(S.ph==='cruise'||S.ph==='boost'){
    S.t+=dt;S.spawn-=dt;
    if(S.spawn<=0&&S.ph==='cruise'){S.spawn=rnd(.5,.9);const r=Math.random(),k=r<.5?'⭐':r<.62?'⛽':r<.82?'🐦':'⛈️';S.objs.push({k,x:W+40,y:rnd(70,H-70),v:rnd(150,230),wob:rnd(0,6)})}
    if(S.ph==='cruise'&&S.t>=CRUISE)ask();
    if(S.ph==='boost'&&S.boost<=0)afterBoost();
  }
  S.objs.forEach(o=>{o.x-=o.v*sp*dt;o.wob+=dt*4;if(o.k==='🐦')o.y+=Math.sin(o.wob)*40*dt});
  if(S.ph==='cruise'||S.ph==='boost')S.objs.forEach(o=>{
    if(o.dead)return;const d=Math.hypot(o.x-S.px,o.y-S.py),R=o.k==='⛈️'?48:34;
    if(d<R){o.dead=true;
      if(o.k==='⭐'||o.k==='⛽'){S.stars++;S.pts+=o.k==='⛽'?20:10;sfx.star();burst(o.x,o.y,10,['#ffc93c','#fff'],160)}
      else{S.pts=Math.max(0,S.pts-5);S.flash=.3;S.flashC='#ff5a5f';sfx.hit();burst(o.x,o.y,10,['#aaa','#fff'],140);say('Bump! −5 points',1)}}});
  S.objs=S.objs.filter(o=>!o.dead&&o.x>-60);
  if(S.ph==='landing'){
    S.wt+=dt;S.island=Math.min(1,S.wt/2);
    const lx=W*.62,ly=H*.78-34;
    S.px+=(lx-S.px)*dt*.9;S.py+=(ly-S.py)*dt*.9;S.tilt=.12;
    if(S.wt>4.2)win();
  }
  if(S.ph==='crash'){
    S.wt+=dt;S.ang+=dt*9;S.py+=dt*(S.wt<1.6?260:50);S.px+=dt*30;
    if(Math.random()<.9)smoke(S.px,S.py,'#222');
    if(S.py>H-90){S.py=H-90}
    if(S.wt>4.5&&!S.over)lose();
  }
  if(S.ph==='win'){S.wt+=dt;S.fw-=dt;if(S.fw<=0){S.fw=.35;const x=rnd(W*.1,W*.9),y=rnd(H*.1,H*.5),c=['#ff5a5f','#ffc93c','#2fbf71','#7b5cff','#22b8f0'];burst(x,y,28,[c[Math.floor(rnd(0,5))],'#fff'],260);sfx.boom()}if(Math.random()<.2)confetti()}
  S.parts.forEach(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.k==='r')p.vx+=Math.sin(p.y/30)*20*dt});
  S.parts=S.parts.filter(p=>p.l>0&&p.y<H+20);
  if(S.flash>0)S.flash-=dt;if(S.msgT>0)S.msgT-=dt;
  $('hQ').textContent='🎯 '+Math.min(S.qi+1,Q.length)+'/'+Q.length;
  $('hS').textContent='⭐ '+S.stars+'  ·  '+S.pts+' pts';
  $('hH').textContent='❤️'.repeat(Math.max(0,3-S.wrong))+'🖤'.repeat(Math.min(3,S.wrong));
}

function ask(){
  S.ph='ask';S.objs=S.objs.filter(o=>o.x>0);sfx.siren();S.flash=.6;S.flashC='#ff5a5f';
  const q=Q[S.qi];$('qt').textContent=q.type;$('qt').style.background=q.type==='Give reason for'?'#7b5cff':'#ff8a3c';
  $('qp').textContent=q.prompt;$('qa').value='';$('qa').disabled=false;$('qf').innerHTML='';
  $('qs').style.display='';$('qs').textContent='Transmit code 📡';$('qs').dataset.mode='send';$('qx').style.display='none';
  $('qbox').classList.remove('shake');$('qov').classList.add('on');setTimeout(()=>$('qa').focus(),300);
}
function submitQ(){
  if(!S||S.ph!=='ask')return;
  const q=Q[S.qi],txt=$('qa').value,r=evaluate(q,txt);
  S.res.push({prompt:q.prompt,answer:txt,model:q.modelAnswer,result:r.pass?'pass':'fail'});
  $('qa').disabled=true;S.ph='fb';
  if(r.pass){
    S.pts+=100;S.wrong>0&&say('Plane fully repaired! 🔧',2.5);S.wrong=0;sfx.win();S.flash=.5;S.flashC='#2fbf71';burst(S.px,S.py,40,['#ffc93c','#fff','#2fbf71'],320);
    $('qf').innerHTML='<div class="fb ok"><b>System Repaired &amp; Clearance Granted! ⭐</b><br>Your answer: '+r.html+'<br><small>Model answer: '+esc(q.modelAnswer)+'</small></div>';
  }else{
    S.wrong++;sfx.wrong();$('qbox').classList.add('shake');S.flash=.5;S.flashC='#ff5a5f';
    const dmg=S.wrong===1?'⚠️ Wing Damaged! Warning!':S.wrong===2?'🔥 Critical Damage! Engine failed!':'💥 Mission Failed - Try Again!';
    const clue=r.short?'Write a full sentence (at least 3 words).':r.miss.length?'Missing clue: <b>'+esc(r.miss[0].join(' / '))+'</b>':'';
    $('qf').innerHTML='<div class="fb bad"><b>'+dmg+'</b><br>🕵️ '+clue+'<br>Your answer: '+r.html+'<br><b>Model answer:</b> '+esc(q.modelAnswer)+'</div>';
  }
  $('qs').textContent='Continue ✈️';$('qs').dataset.mode='go';
}
function afterQ(){
  $('qov').classList.remove('on');
  const pass=S.res[S.res.length-1].result==='pass';
  S.qi++;
  if(S.wrong>=3){crash();return}
  if(pass){S.ph='boost';S.boost=2.5;say('TURBO BOOST! 🚀',2)}
  else{S.ph='boost';S.boost=.01}
}
function afterBoost(){
  if(S.qi>=Q.length){S.ph='landing';S.wt=0;S.objs=[];say('Secret Scientist Island ahead!',3);return}
  S.ph='cruise';S.t=0;S.spawn=.3;
}
function crash(){S.ph='crash';S.wt=0;S.ang=0;S.objs=[];sfx.wrong();say('Mission Failed — parachute landing!',3)}

/* ---------- end screens & logging ---------- */
function finish(ok){
  S.over=true;
  const attempts=LS.g('sp_att',{});attempts[student]=(attempts[student]||0)+1;LS.s('sp_att',attempts);
  const rec={student,attempt:attempts[student],score:S.pts+' pts, '+S.stars+' stars',timeSec:Math.round(S.time),details:S.res,date:new Date().toISOString(),completed:ok};
  const log=LS.g('sp_log',[]);log.push(rec);LS.s('sp_log',log);
  const url=LS.g('sp_url','');
  if(url){try{fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}).catch(()=>{})}catch(e){}}
}
function win(){
  S.ph='win';S.wt=0;S.fw=0;sfx.fanfare();finish(true);
  setTimeout(()=>{
    $('ebox').innerHTML='<div style="font-size:64px">🏆</div><h1>Island reached!</h1><p>Golden Wings awarded! 🧰 The secret chest opens…</p>'+
    '<div class="lic">📜 <small>Funny Official Document</small><b>MASTER SCIENTIST LICENSE</b>This certifies that<b style="color:#7b5cff">'+esc(student)+'</b>may fly, float, rust and explain anything.<br><small>Signed: Captain Beaker, Chief of Clouds</small></div>'+
    '<p>⭐ '+S.stars+' stars · '+S.pts+' points · '+Math.round(S.time)+' s</p><div class="row" style="justify-content:center"><button class="grn" onclick="again()">Fly Again</button></div>';
    $('eov').classList.add('on');
  },3500);
}
function lose(){
  finish(false);
  $('ebox').innerHTML='<div style="font-size:64px">🪂</div><h1>Mission Failed - Try Again!</h1><p>You floated down safely. Review the model answers and try again, '+esc(student)+'!</p><p>⭐ '+S.stars+' stars · '+S.pts+' points</p><div class="row" style="justify-content:center"><button class="grn" onclick="again()">Fly Again</button></div>';
  $('eov').classList.add('on');
}
function again(){$('eov').classList.remove('on');newGame()}
window.again=again;

/* ---------- drawing ---------- */
function draw(){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd3ff');g.addColorStop(.7,'#d6f1ff');g.addColorStop(1,'#fff3d6');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='#ffe27a';cx.beginPath();cx.arc(W*.85,H*.15,Math.min(W,H)*.07,0,7);cx.fill();
  clouds.forEach(c=>{cloud(c.x*W,c.y*H,c.s*Math.min(W,H)/9)});
  if(!S){plane(W*.5,H*.62,0,0,0,performance.now()/30);return}
  if(S.island>0||S.ph==='win')island();
  S.objs.forEach(o=>{cx.font=(o.k==='⛈️'?80:46)+'px serif';cx.textAlign='center';cx.textBaseline='middle';
    if(o.k==='⭐'||o.k==='⛽'){cx.shadowColor='#ffc93c';cx.shadowBlur=18}
    cx.fillText(o.k,o.x,o.y);cx.shadowBlur=0});
  if(S.ph==='crash'){plane(S.px,S.py,S.ang,3,3,S.prop*.2);if(S.wt>1.6){cx.font='80px serif';cx.fillText('🪂',S.px,S.py-70)}}
  else plane(S.px,S.py,S.tilt,S.wrong,S.wrong,S.prop);
  S.parts.forEach(p=>{cx.globalAlpha=Math.max(0,Math.min(1,p.l/p.m));cx.fillStyle=p.c;
    if(p.k==='r')cx.fillRect(p.x,p.y,p.r,p.r*1.6);else{cx.beginPath();cx.arc(p.x,p.y,p.r*(p.k==='s'?(2-p.l/p.m):1),0,7);cx.fill()}});
  cx.globalAlpha=1;
  if(S.flash>0){cx.fillStyle=S.flashC;cx.globalAlpha=Math.min(.35,S.flash);cx.fillRect(0,0,W,H);cx.globalAlpha=1}
  if(S.msgT>0){cx.font='700 '+Math.max(22,Math.min(W/14,44))+'px Fredoka,sans-serif';cx.textAlign='center';cx.lineWidth=6;cx.strokeStyle='#23395b';cx.fillStyle='#fff';cx.strokeText(S.msg,W/2,H*.22);cx.fillText(S.msg,W/2,H*.22)}
}
function cloud(x,y,r){cx.fillStyle='rgba(255,255,255,.9)';cx.beginPath();[[0,0,1],[.9,.2,.8],[-.9,.25,.75],[.3,-.4,.8],[-.4,-.3,.7]].forEach(([a,b,s])=>{cx.moveTo(x+a*r+r*s,y+b*r);cx.arc(x+a*r,y+b*r,r*s,0,7)});cx.fill()}
function island(){
  const t=S.ph==='win'?1:S.island,x=W*.62+(1-t)*W,y=H*.78;
  cx.fillStyle='#4cc3e8';cx.fillRect(0,y+34,W,H);
  cx.fillStyle='#f2d58a';cx.beginPath();cx.ellipse(x,y+30,W*.28,60,0,Math.PI,0);cx.fill();
  cx.fillStyle='#5bd16b';cx.beginPath();cx.ellipse(x,y+24,W*.22,34,0,Math.PI,0);cx.fill();
  cx.font='60px serif';cx.textAlign='center';cx.textBaseline='alphabetic';cx.fillText('🌴',x-W*.15,y+10);cx.fillText('🏝️',x+W*.17,y+14);
  cx.fillStyle='#fff';cx.fillRect(x-W*.1,y-2,W*.2,6);cx.fillStyle='#23395b';cx.font='700 16px Fredoka,sans-serif';cx.fillText('Secret Scientist Island',x,y+60)
}
function plane(x,y,rot,wing,eng,prop){
  cx.save();cx.translate(x,y);cx.rotate(rot);
  // tail
  cx.fillStyle='#ff5a5f';cx.beginPath();cx.moveTo(-40,-4);cx.lineTo(-62,-26);cx.lineTo(-52,-26);cx.lineTo(-24,-4);cx.fill();
  cx.beginPath();cx.moveTo(-58,0);cx.lineTo(-30,4);cx.lineTo(-58,10);cx.fill();
  // far wing
  cx.fillStyle=wing>=1?'#b9402f':'#ffc93c';cx.beginPath();cx.ellipse(-4,-14,26,8,-.35,0,7);cx.fill();
  // body
  cx.fillStyle='#ff5a5f';cx.strokeStyle='#23395b';cx.lineWidth=3;cx.beginPath();cx.ellipse(0,4,48,19,0,0,7);cx.fill();cx.stroke();
  cx.fillStyle='#fffdf7';cx.beginPath();cx.ellipse(-4,6,28,6,0,0,7);cx.fill();
  cx.fillStyle='#9fe3ff';cx.beginPath();cx.arc(8,-6,10,0,7);cx.fill();cx.stroke();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(5,-9,3,0,7);cx.fill();
  // near wing
  cx.fillStyle=wing>=1?'#d9553d':'#ffd55e';cx.beginPath();cx.ellipse(-2,16,32,9,.3,0,7);cx.fill();cx.stroke();
  if(wing>=1){cx.fillStyle='#222';cx.beginPath();cx.arc(-14,18,4,0,7);cx.fill()}
  // nose
  cx.fillStyle=eng>=2?'#555':'#7b5cff';cx.beginPath();cx.arc(46,4,9,0,7);cx.fill();cx.stroke();
  // propeller
  cx.save();cx.translate(54,4);if(eng<2)cx.scale(.2+Math.abs(Math.cos(prop)),1);cx.fillStyle=eng>=2?'#666':'#23395b';cx.fillRect(-3,-24,6,48);cx.restore();
  cx.restore();
}

/* ---------- loop & input ---------- */
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(S&&!S.over)update(dt);else if(S){S.prop+=dt*40;S.parts.forEach(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt});if(S.ph==='win')update(dt)}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(k.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
cv.addEventListener('pointerdown',e=>{ac();tgt={x:e.clientX-30,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')tgt={x:e.clientX-30,y:e.clientY}});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();keys[k]=true},off=()=>keys[k]=false;b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off))});

/* ---------- gate ---------- */
(function(){
  const p=new URLSearchParams(location.search),n=p.get('student');
  if(n){const ok=p.get('sig')===hash(n+'|'+p.get('code')+'|'+SALT);
    if(ok){$('nm').value=n;$('nm').readOnly=true;$('lockNote').textContent='Your teacher\'s link is verified ✔'}
    else $('lockNote').textContent='This link could not be verified — type your name below.'}
})();
$('go').onclick=()=>{const n=$('nm').value.trim();if(!n){$('nm').focus();$('nm').placeholder='Please type your name first';return}
  if(!Q.length){alert('No questions yet. Ask your teacher to add some in the Teacher Portal.');return}
  student=n;ac();$('gate').classList.remove('on');newGame()};
$('qs').onclick=()=>{if($('qs').dataset.mode==='go'){afterQ();return}
  if(!$('qa').value.trim()){$('qa').focus();return}submitQ()};
$('qx').onclick=()=>{$('qov').classList.remove('on')};
$('qa').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('qs').click()});

/* ---------- teacher portal ---------- */
const SCRIPT=`function doPost(e){
  var d=JSON.parse(e.postData.contents);
  var sh=SpreadsheetApp.getActiveSheet();
  if(sh.getLastRow()==0)sh.appendRow(['Date','Student','Attempt','Score','Time (s)','Details']);
  sh.appendRow([d.date,d.student,d.attempt,d.score,d.timeSec,JSON.stringify(d.details)]);
  return ContentService.createTextOutput('ok');
}
function doGet(){return ContentService.createTextOutput('SkyPilot sync ready');}`;
let tab='q';
const TABS={q:'Questions',s:'Sync',l:'Student Links',r:'Review'};
function portal(){
  $('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'on':''}" data-t="${k}">${v}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;portal()});
  const B=$('pbody');
  if(tab==='q'){
    B.innerHTML='<p><small>Keywords: separate required ideas with commas, and synonyms with | (e.g. <code>densit, less|lower, water</code>). Partial words work as stems.</small></p>'+
    Q.map((q,i)=>`<div class="q" data-i="${i}"><select data-f="type"><option${q.type==='Give reason for'?' selected':''}>Give reason for</option><option${q.type==='What happens if'?' selected':''}>What happens if</option></select>
    <input data-f="prompt" value="${esc(q.prompt)}" placeholder="Prompt" aria-label="Prompt"><textarea data-f="modelAnswer" placeholder="Model answer" aria-label="Model answer">${esc(q.modelAnswer)}</textarea>
    <input data-f="requiredKeywords" value="${esc(q.requiredKeywords)}" placeholder="Keywords" aria-label="Keywords">
    <div class="row" style="margin:6px 0 0"><button class="sec" data-a="pv">Preview</button><button class="sec" data-a="del">Delete</button></div></div>`).join('')+
    '<div class="row"><button class="grn" id="addq">+ Add question</button><button class="sec" id="rst">Restore sample questions</button></div>';
    B.querySelectorAll('.q [data-f]').forEach(el=>el.onchange=()=>{Q[el.closest('.q').dataset.i][el.dataset.f]=el.value;saveQ()});
    B.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.closest('.q').dataset.i;
      if(b.dataset.a==='del'){Q.splice(i,1);saveQ();portal()}
      else{preview(Q[i])}});
    $('addq').onclick=()=>{Q.push({type:'Give reason for',prompt:'',modelAnswer:'',requiredKeywords:''});saveQ();portal()};
    $('rst').onclick=()=>{if(confirm('Replace all questions with the samples?')){Q=DEFAULT_Q.slice();saveQ();portal()}};
  }else if(tab==='s'){
    B.innerHTML='<p><b>Google Apps Script Web App URL</b></p><input id="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(LS.g('sp_url',''))+'">'+
    '<div class="row"><button class="grn" id="su">Save URL</button><button class="sec" id="st">Send test row</button></div><p id="sm"></p>'+
    '<ol><li>Create a Google Sheet, then Extensions → Apps Script.</li><li>Paste the code below and save.</li><li>Deploy → New deployment → Web app. Execute as <b>Me</b>, access <b>Anyone</b>.</li><li>Copy the Web App URL, paste it above, and press Save.</li></ol><pre id="code"></pre><button class="sec" id="cp">Copy script</button>';
    $('code').textContent=SCRIPT;
    $('su').onclick=()=>{LS.s('sp_url',$('url').value.trim());$('sm').textContent='Saved ✔'};
    $('st').onclick=()=>{const u=$('url').value.trim();if(!u){$('sm').textContent='Paste the URL first.';return}LS.s('sp_url',u);
      fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({student:'TEST',attempt:0,score:'0 pts',timeSec:0,details:[{prompt:'Test',answer:'Test row',model:'-',result:'pass'}],date:new Date().toISOString()})})
      .then(()=>$('sm').textContent='Test row sent — check your sheet.').catch(()=>$('sm').textContent='Could not reach the URL. Check it and try again.')};
    $('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(SCRIPT).then(()=>$('cp').textContent='Copied ✔');
  }else if(tab==='l'){
    B.innerHTML='<p>One student name per line:</p><textarea id="names" placeholder="Aisha&#10;Omar&#10;Lina">'+esc(LS.g('sp_names',''))+'</textarea><div class="row"><button class="grn" id="mk">Make links</button></div><div id="lk"></div>';
    $('mk').onclick=()=>{const list=$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);LS.s('sp_names',$('names').value);
      const base=location.href.split('?')[0].split('#')[0];
      $('lk').innerHTML=list.map(n=>{const c=hash(n).slice(0,4),u=base+'?student='+encodeURIComponent(n)+'&code='+c+'&sig='+hash(n+'|'+c+'|'+SALT);
        return `<div class="q"><b>${esc(n)}</b><input readonly value="${esc(u)}" aria-label="Link for ${esc(n)}"><button class="sec" data-u="${esc(u)}">Copy link</button></div>`}).join('');
      $('lk').querySelectorAll('button').forEach(b=>b.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(b.dataset.u).then(()=>b.textContent='Copied ✔'))};
  }else{
    const log=LS.g('sp_log',[]);
    B.innerHTML='<div class="row" style="margin:0 0 8px"><button class="grn" id="csv">Download CSV</button><button class="sec" id="clr">Clear local log</button></div>'+
    (log.length?'<table><tr><th>Student</th><th>Try</th><th>Score</th><th>Time</th><th>Answers</th></tr>'+log.slice().reverse().map(r=>`<tr><td>${esc(r.student)}<br><small>${esc(r.date.slice(0,16).replace('T',' '))}</small></td><td>${r.attempt}</td><td>${esc(r.score)}</td><td>${r.timeSec}s</td><td>${r.details.map(d=>(d.result==='pass'?'✅ ':'❌ ')+esc(d.answer)).join('<br>')}</td></tr>`).join('')+'</table>':'<p>No submissions yet. They appear here after a student finishes a mission on this device.</p>');
    $('csv').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['date','student','attempt','score','timeSec','prompt','answer','model','result']];
      log.forEach(r=>r.details.forEach(d=>rows.push([r.date,r.student,r.attempt,r.score,r.timeSec,d.prompt,d.answer,d.model,d.result])));
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='skypilot-results.csv';a.click()};
    $('clr').onclick=()=>{if(confirm('Delete the log stored on this device?')){LS.s('sp_log',[]);portal()}};
  }
}
function preview(q){
  $('qt').textContent=q.type;$('qt').style.background='#7b5cff';$('qp').textContent=q.prompt||'(empty prompt)';$('qa').value='';$('qa').disabled=true;
  $('qf').innerHTML='<div class="fb ok"><small>Model answer:</small> '+esc(q.modelAnswer)+'<br><small>Keywords: '+esc(q.requiredKeywords)+'</small></div>';
  $('qs').style.display='none';$('qx').style.display='';$('qov').classList.add('on');
}
$('tp').onclick=()=>{$('por').classList.add('on');portal()};
$('pc').onclick=()=>$('por').classList.remove('on');
</script>
